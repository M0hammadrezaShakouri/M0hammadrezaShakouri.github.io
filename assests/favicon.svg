<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="accent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e6317a"/>
      <stop offset="50%" stop-color="#d6c23a"/>
      <stop offset="100%" stop-color="#7a9e3a"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="128" height="128" rx="18" fill="#15171c"/>

  <!-- thin colorful accent arc, echoing the swirl in the reference logo -->
  <path d="M 14 96 A 70 70 0 0 1 96 14" stroke="url(#accent)" stroke-width="4"
        fill="none" stroke-linecap="round" opacity="0.85"/>

  <!-- MS monogram -->
  <text x="64" y="80" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-size="58"
        font-weight="700" fill="#ffffff">MS</text>
</svg>
